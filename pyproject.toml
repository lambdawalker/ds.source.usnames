[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-synthetic-names"
version = "0.1.0"
description = "Source-tracked US synthetic names with frequency, cohort and length controls"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "regex>=2024.0"]

[project.scripts]
us-names-download = "us_names.download:main"
us-names = "us_names.cli:main"
us-names-build = "us_names.build:main"

[tool.setuptools.packages.find]
include = ["us_names*"]
