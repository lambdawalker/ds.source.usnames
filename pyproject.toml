[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-names-source"
version = "0.2.0"
description = "Build and release the US names SQLite dataset from government sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "regex>=2024.0"]

[project.urls]
Repository = "https://github.com/lambdawalker/ds.source.usnames"
Consumer = "https://github.com/lambdawalker/ds.python.usnames"

[project.scripts]
us-names-source-download = "us_names_source.download:main"
us-names-build = "us_names_source.build:main"
us-names-export = "us_names_source.export:main"

[tool.setuptools.packages.find]
include = ["us_names_source*"]
